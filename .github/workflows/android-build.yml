name: Android Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
      with:
        submodules: 'recursive'

    - name: Set up Android NDK
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: r25b # You can specify your desired NDK version

    - name: Configure CMake
      run: |
        cmake -B build -S .           -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake           -DANDROID_ABI=arm64-v8a           -DANDROID_PLATFORM=android-21           -DANDROID_STL=c++_shared

    - name: Build
      run: cmake --build build --target kernel

    - name: Upload Artifact
      uses: actions/upload-artifact@v3
      with:
        name: android-library
        path: build/libkernel.so # Adjust the path if necessary
